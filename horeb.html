<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hack-Hawassa Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <div class="container">
      <div class="header">
        <h1>Hack-Hawassa Registration</h1>
        <div class="subtitle">
          <b>HOREB DS</b> <br />
          DIGITAL MISSION<br />
          ETERNAL VISION
        </div>
      </div>

      <!-- Success Message -->
      <div id="flashMessage" class="flash-message">
        Registration submitted successfully!<br />
        <small>Data saved locally. In production, connect to a backend.</small>
      </div>

      <form id="registrationForm">
        <div class="form-group">
          <label class="required">Full Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
          />
        </div>

        <div class="form-group">
          <label class="required">Department:</label>
          <input
            type="text"
            id="department"
            name="department"
            required
            placeholder="e.g., Computer Science"
          />
        </div>

        <div class="form-group">
          <label class="required">Year:</label>
          <input
            type="text"
            id="year"
            name="year"
            required
            placeholder="e.g., 3rd year"
          />
        </div>

        <div class="form-group">
          <label class="required">Team:</label>
          <input
            type="text"
            id="team"
            name="team"
            required
            placeholder="e.g., Horeb"
          />
        </div>

        <div class="form-group">
          <label class="required">Register As:</label>
          <select name="role" id="role" onchange="showOptions()" required>
            <option value="">-- Select Your Role --</option>
            <option value="student">Student</option>
            <option value="professional">Professional</option>
          </select>
        </div>

        <!-- STUDENT SECTION -->
        <div id="student_section" class="role-section hidden">
          <label class="required">Skill Category:</label>
          <select name="student_category" id="student_category">
            <option value="">-- Select Your Skill --</option>
            <option value="Video - Cinematography">
              Video - Cinematography
            </option>
            <option value="Video - Editing">Video - Editing</option>
            <option value="Video - Acting">Video - Acting</option>
            <option value="Video - Writing">Video - Writing</option>
            <option value="Song - Mixing">Song - Mixing</option>
            <option value="Song - Writing">Song - Writing</option>
            <option value="Song - Melody">Song - Melody</option>
            <option value="Developing - Front-end">
              Developing - Front-end
            </option>
            <option value="Developing - Back-end">Developing - Back-end</option>
            <option value="Developing - Full stack">
              Developing - Full Stack
            </option>
          </select>
        </div>

        <!-- PROFESSIONAL SECTION -->
        <div id="professional_section" class="role-section hidden">
          <label class="required">Profession:</label>
          <select name="profession_type" id="profession_type">
            <option value="">-- Select Your Profession --</option>
            <option value="Production">Production</option>
            <option value="Full Stack Developer">Full Stack Developer</option>
            <option value="Song Maker">Song Maker</option>
          </select>
        </div>

        <!-- EXPECTATIONS -->
        <div class="form-group">
          <label
            >What do you expect from this program?
            <span class="optional">(Optional)</span></label
          >
          <textarea
            name="expectations"
            id="expectations"
            placeholder="Please share your expectations..."
            maxlength="500"
            oninput="updateCharCount()"
          ></textarea>
          <div class="char-count">
            <span id="charCount">0</span>/500 characters
          </div>
        </div>

        <div>
          <h5 style="color: #e74c3c">
            BE SURE THAT YOU PAID 300 BIRR IN THIS CBE ACCOUNT "1000346125717"
          </h5>
        </div>
        <br />
        <button type="submit">Register Now</button>
      </form>
    </div>

    <script>
      const form = document.getElementById("registrationForm");
      const submitBtn = form.querySelector("button[type='submit']");
      const flashMessage = document.getElementById("flashMessage");

      // Save locally
      function saveRegistration(data) {
        let registrations = JSON.parse(
          localStorage.getItem("hackHawassaRegistrations") || "[]"
        );
        data.id = Date.now();
        data.timestamp = new Date().toLocaleString();
        registrations.push(data);
        localStorage.setItem(
          "hackHawassaRegistrations",
          JSON.stringify(registrations)
        );
      }

      // Show success message
      function showSuccess(message = "Registration submitted successfully!") {
        flashMessage.innerHTML = `${message}<br><small>Thank you!</small>`;
        flashMessage.classList.add("show");
        setTimeout(() => flashMessage.classList.remove("show"), 6000);
      }

      // Handle form submission
      async function handleSubmit(event) {
        event.preventDefault();

        // Disable button + show loading state
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
        submitBtn.style.opacity = "0.7";

        const formData = {
          name: document.getElementById("name").value.trim(),
          department: document.getElementById("department").value.trim(),
          year: document.getElementById("year").value.trim(),
          team: document.getElementById("team").value.trim(),
          role: document.getElementById("role").value,
          expectations: document.getElementById("expectations").value.trim(),
        };

        // Role-specific fields
        if (formData.role === "student") {
          formData.category = document.getElementById("student_category").value;
          if (!formData.category)
            return alert("Please select your skill category!");
        } else if (formData.role === "professional") {
          formData.profession =
            document.getElementById("profession_type").value;
          if (!formData.profession)
            return alert("Please select your profession!");
        } else {
          return alert("Please select your role!");
        }

        // Required fields check
        if (
          !formData.name ||
          !formData.department ||
          !formData.year ||
          !formData.team
        ) {
          alert("Please fill all required fields!");
          resetButton();
          return;
        }

        // Save locally first (backup)
        saveRegistration(formData);

        try {
          const response = await fetch("/api/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });

          if (response.ok) {
            showSuccess("Successfully registered! Welcome to Hack-Hawassa!");
            form.reset();
            showOptions(); // Reset role sections
            updateCharCount();
          } else {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error || "Server error");
          }
        } catch (error) {
          console.error("Submission failed:", error);
          showSuccess(
            "Registered locally (offline mode) — will sync when online!"
          );
          alert(
            "No internet or server issue — your data is saved safely on this device!"
          );
        } finally {
          // Always re-enable button after 1 second
          setTimeout(resetButton, 1000);
        }
      }

      function resetButton() {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register Now";
        submitBtn.style.opacity = "1";
      }

      function showOptions() {
        const role = document.getElementById("role").value;
        document
          .getElementById("student_section")
          .classList.toggle("hidden", role !== "student");
        document
          .getElementById("professional_section")
          .classList.toggle("hidden", role !== "professional");

        document.getElementById("student_category").required =
          role === "student";
        document.getElementById("profession_type").required =
          role === "professional";
      }

      function updateCharCount() {
        const length = document.getElementById("expectations").value.length;
        const counter = document.getElementById("charCount");
        counter.textContent = length;
        counter.style.color =
          length > 450 ? "#e74c3c" : length > 400 ? "#f39c12" : "#666";
      }

      // Init
      window.onload = () => {
        updateCharCount();
        showOptions();
        form.onsubmit = handleSubmit;
      };
    </script>
  </body>
</html>
